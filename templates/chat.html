<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קליניקת לייזר - בירור וקביעת תורים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAF9F6; --ink: #2C2C2C; --muted: #6E6A63; --muted-3: #A9A59C;
            --gold: #B99A64; --gold-bar: #C9AC79; --gold-ink: #A8874F; --gold-bg: #F5F0E6;
            --border: rgba(44,44,44,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Assistant', 'Segoe UI', sans-serif;
            background: var(--bg);
            height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .chat-window {
            background: #fff; border-radius: 20px;
            box-shadow: 0 1px 2px rgba(44,44,44,0.03), 0 24px 60px rgba(44,44,44,0.12);
            width: 100%; max-width: 480px; height: 100%; max-height: 700px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(150deg, var(--gold-bar), var(--gold-ink));
            color: #fff; padding: 20px 22px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header h1 { font-size: 17px; font-weight: 600; }
        .chat-header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        .reset-button {
            background: rgba(255,255,255,0.22); color: #fff; border: none; border-radius: 8px;
            padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
        }
        .reset-button:hover { background: rgba(255,255,255,0.35); }
        .messages { flex: 1; overflow-y: auto; padding: 22px; background: var(--bg); }
        .bubble {
            max-width: 82%; padding: 12px 16px; border-radius: 16px; margin-bottom: 12px;
            font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
        }
        .bubble.bot {
            background: #fff; color: var(--ink); border: 1px solid var(--border);
            border-bottom-right-radius: 4px; margin-left: auto; margin-right: 0;
        }
        .bubble.user {
            background: var(--ink); color: #fff;
            border-bottom-left-radius: 4px; margin-right: auto; margin-left: 0;
        }
        .typing {
            display: none; gap: 4px; padding: 12px 16px; width: fit-content; margin: 0 22px 12px auto;
            background: #fff; border: 1px solid var(--border); border-radius: 16px;
        }
        .typing.visible { display: flex; }
        .typing span { width: 7px; height: 7px; background: var(--muted-3); border-radius: 50%; animation: bounce 1.3s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
        .composer { display: flex; gap: 10px; padding: 16px; background: #fff; border-top: 1px solid var(--border); }
        .composer input {
            flex: 1; padding: 12px 15px; font-size: 15px; border: 1px solid rgba(44,44,44,0.14);
            border-radius: 24px; font-family: inherit; background: #FCFAF6;
        }
        .composer input:focus { outline: none; border-color: var(--gold-bar); }
        .send-button {
            background: var(--ink); color: #fff; border: none; border-radius: 24px;
            padding: 0 22px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
        }
        .send-button:hover { background: #3D3B37; }
        .send-button:disabled { background: #C7C3BB; cursor: not-allowed; }
        .locked-notice { display: none; background: #F8ECEE; color: #B4485A; padding: 12px; text-align: center; font-size: 14px; }
        .locked-notice.visible { display: block; }
    </style>
</head>
<body>

    <div class="chat-window">
        <div class="chat-header">
            <div>
                <h1>קליניקת לייזר</h1>
                <p>בירור וקביעת תורים</p>
            </div>
            <button class="reset-button" id="resetButton">שיחה חדשה</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="typing" id="typing">
            <span></span><span></span><span></span>
        </div>

        <div class="locked-notice" id="lockedNotice">
            השיחה נחסמה מטעמי אבטחת מידע
        </div>

        <div class="composer">
            <input type="text" id="messageInput"
                   placeholder="כתבי כאן..." autocomplete="off">
            <button class="send-button" id="sendButton">שליחה</button>
        </div>
    </div>

<script>
    const messagesArea = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const resetButton = document.getElementById("resetButton");
    const typingIndicator = document.getElementById("typing");
    const lockedNotice = document.getElementById("lockedNotice");

    function addBubble(text, sender) {
        const bubble = document.createElement("div");
        bubble.className = "bubble " + sender;
        bubble.textContent = text;
        messagesArea.appendChild(bubble);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function setBusy(isBusy) {
        sendButton.disabled = isBusy;
        messageInput.disabled = isBusy;
        typingIndicator.classList.toggle("visible", isBusy);
        if (isBusy) messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function lockConversation() {
        lockedNotice.classList.add("visible");
        messageInput.disabled = true;
        sendButton.disabled = true;
    }

    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        addBubble(text, "user");
        messageInput.value = "";
        setBusy(true);

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            setBusy(false);

            if (data.reply) {
                addBubble(data.reply, "bot");
            } else {
                addBubble(data.error || "משהו השתבש, אפשר לנסות שוב?", "bot");
            }

            if (data.state === "locked") {
                lockConversation();
            }

        } catch (error) {
            setBusy(false);
            addBubble("שגיאת תקשורת, אפשר לנסות שוב?", "bot");
        }

        messageInput.focus();
    }

    async function resetConversation() {
        await fetch("/api/chat/reset", { method: "POST" });

        messagesArea.innerHTML = "";
        lockedNotice.classList.remove("visible");
        messageInput.disabled = false;
        sendButton.disabled = false;

        showWelcome();
        messageInput.focus();
    }

    function showWelcome() {
        addBubble(
            "שלום, אני העוזר הדיגיטלי של הקליניקה.\n" +
            "אפשר לבדוק כאן פרטי תור קיים, ואפילו לקבוע תור חדש.\n" +
            "איך קוראים לך?",
            "bot"
        );
    }

    sendButton.addEventListener("click", sendMessage);
    resetButton.addEventListener("click", resetConversation);

    messageInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") sendMessage();
    });

    showWelcome();
    messageInput.focus();
</script>

</body>
</html>
