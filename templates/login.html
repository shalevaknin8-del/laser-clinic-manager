<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה למערכת - קליניקת לייזר</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="brand-mark" style="width:44px;height:44px;"><span style="width:13px;height:13px;"></span></div>
                <div style="text-align:center;">
                    <div style="font-size:17px;font-weight:600;">קליניקת לייזר</div>
                    <div class="text-sm text-muted">כניסת צוות</div>
                </div>
            </div>

            <div class="field">
                <label>מספר טלפון</label>
                <input type="tel" id="phone" class="ltr" autocomplete="username" placeholder="0501234567">
            </div>
            <div class="field">
                <label>סיסמה</label>
                <input type="password" id="password" autocomplete="current-password">
            </div>
            <div id="loginError" class="field-error" style="margin-bottom:10px;"></div>
            <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">התחברות</button>
        </div>
    </div>

<script>
    const ACCESS_KEY = "clinic_access_token";
    const REFRESH_KEY = "clinic_refresh_token";

    if (localStorage.getItem(ACCESS_KEY)) {
        window.location.href = "/";
    }

    const phoneInput = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const errorEl = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");

    async function doLogin() {
        errorEl.textContent = "";
        loginBtn.disabled = true;
        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone: phoneInput.value, password: passwordInput.value }),
            });
            const data = await response.json();
            if (!response.ok) {
                errorEl.textContent = data.error || "שגיאה בהתחברות";
                return;
            }
            localStorage.setItem(ACCESS_KEY, data.access_token);
            localStorage.setItem(REFRESH_KEY, data.refresh_token);
            window.location.href = "/";
        } catch (e) {
            errorEl.textContent = "שגיאת תקשורת, אפשר לנסות שוב?";
        } finally {
            loginBtn.disabled = false;
        }
    }

    loginBtn.addEventListener("click", doLogin);
    passwordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
